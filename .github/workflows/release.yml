name: Release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to create, e.g. v2.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Zip the integration
        run: cd custom_components/iptv_xtream && zip -r ../../iptv_xtream.zip .

      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: awk -v h="## $TAG" '$0==h{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md

      # Creates the release when a tag is pushed or the workflow is run by hand, or adds the zip to a release published from the UI
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: iptv_xtream.zip
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          name: ${{ inputs.tag || github.ref_name }}
          body_path: notes.md
