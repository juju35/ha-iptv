name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Zip the integration
        run: cd custom_components/iptv_xtream && zip -r ../../iptv_xtream.zip .

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: iptv_xtream.zip
